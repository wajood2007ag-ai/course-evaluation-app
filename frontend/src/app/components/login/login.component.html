<div style="display:flex; justify-content:center; align-items:center; min-height:calc(100vh - 64px); background:#f5f5f5; padding:16px;">
  <mat-card style="width:100%; max-width:420px; padding:32px; border-radius:16px !important;">

    <mat-card-header style="justify-content:center; margin-bottom:24px;">
      <div style="text-align:center; width:100%;">
        <div style="font-size:3rem;">🎓</div>
        <mat-card-title style="font-family:'Cairo',sans-serif; font-size:1.4rem; margin-top:8px;">
          تسجيل الدخول
        </mat-card-title>
        <mat-card-subtitle>تقييم المقررات الدراسية</mat-card-subtitle>
      </div>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <mat-form-field appearance="outline" style="width:100%; margin-bottom:8px;">
          <mat-label>اسم المستخدم</mat-label>
          <input matInput formControlName="username" autocomplete="username">
          <mat-icon matSuffix>person</mat-icon>
          <mat-error *ngIf="loginForm.get('username')?.hasError('required')">
            اسم المستخدم مطلوب
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" style="width:100%; margin-bottom:20px;">
          <mat-label>كلمة المرور</mat-label>
          <input matInput formControlName="password"
                 [type]="hidePassword ? 'password' : 'text'"
                 autocomplete="current-password">
          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
            كلمة المرور مطلوبة
          </mat-error>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit"
                [disabled]="loginForm.invalid || loading"
                style="width:100%; height:48px; font-size:1rem; font-family:'Cairo',sans-serif;">
          <mat-spinner diameter="20" *ngIf="loading" style="display:inline-block; margin-left:8px;"></mat-spinner>
          <span *ngIf="!loading">دخول</span>
        </button>

      </form>
    </mat-card-content>
  </mat-card>
</div>
